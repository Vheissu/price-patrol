<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Price Patrol compares grocery prices across Coles, Woolworths and ALDI." />
    <title>Price Patrol</title>
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("pp-theme"); } catch (e) {}
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <price-patrol-app></price-patrol-app>
  </body>
</html>
