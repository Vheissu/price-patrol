<template>
<div class="layout-basket grid gap-6">
  <div class="space-y-6">
    <section-shell
      heading="Basket compare"
      subheading="Weekly trolley"
      aside="Build the whole basket, reorder it, then compare the cheapest single-store basket against the split-basket route."
    >
      <div class="basket-form-grid grid gap-4">
        <label class="field-shell lg:col-span-2">
          <span class="field-label">Add item</span>
          <input value.bind="draftItem" class="field-input" placeholder="greek yoghurt" keydown.trigger="handleDraftKeydown($event)" />
        </label>
        <label class="field-shell">
          <span class="field-label">Postcode</span>
          <input value.bind="postcode" class="field-input" placeholder="4101" />
        </label>
        <label class="field-shell">
          <span class="field-label">Suburb</span>
          <input value.bind="suburb" class="field-input" placeholder="West End" />
        </label>
        <button class="action-button" click.trigger="addRow()">Add</button>
      </div>

      <div class="basket-actions-grid mt-4 grid gap-3">
        <label class="field-shell">
          <span class="field-label">Comparison mode</span>
          <select value.bind="mode" class="field-input">
            <option repeat.for="modeOption of modes" model.bind="modeOption">${modeOption}</option>
          </select>
        </label>
        <button class="action-button action-button--secondary mt-auto" click.trigger="compareBasket()" disabled.bind="isSubmitting">
          ${isSubmitting ? 'Pricing…' : 'Price basket'}
        </button>
      </div>

      <div if.bind="error" class="mt-4 error-box">
        ${error}
      </div>
    </section-shell>

    <section-shell
      heading="Basket editor"
      subheading="Items in play"
      aside="Reorder lines to mirror your real shopping flow. Quantity hints stay attached to each item."
    >
      <div class="space-y-3">
        <div repeat.for="row of rows" class="soft-panel">
          <div class="flex flex-col gap-3 md:flex-row md:items-center">
            <div class="flex grow items-center gap-3">
              <div class="flex flex-col gap-2">
                <button class="icon-button" click.trigger="moveRow($index, -1)">↑</button>
                <button class="icon-button" click.trigger="moveRow($index, 1)">↓</button>
              </div>
              <label class="field-shell grow">
                <span class="field-label">Item</span>
                <input value.bind="row.query" class="field-input" />
              </label>
            </div>
            <label class="field-shell md:w-28">
              <span class="field-label">Qty</span>
              <input value.bind="row.quantity" type="number" min="1" class="field-input" />
            </label>
            <button class="icon-button icon-button--danger md:mt-6" click.trigger="removeRow(row.id)">Remove</button>
          </div>
        </div>
      </div>
    </section-shell>
  </div>

  <div class="space-y-6">
    <section-shell
      heading="Strategy totals"
      subheading="Store plans"
      aside="These summaries make the travel tradeoff explicit: split baskets can win on price, but they cost time."
    >
      <div if.bind="basket" class="grid gap-3">
        <article repeat.for="strategy of basket.strategies" class="result-card">
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="eyebrow">Strategy</p>
              <h3 class="mt-2 font-display text-2xl">${strategy.name}</h3>
              <p class="mt-2 text-sm muted-copy">${strategy.itemCount} items priced</p>
            </div>
            <div class="text-right">
              <p class="eyebrow">Total</p>
              <p class="font-display text-4xl">$${strategy.total.toFixed(2)}</p>
              <p if.bind="strategy.savingsVsSplit != null" class="mt-2 text-sm muted-copy">Gap to split: $${strategy.savingsVsSplit.toFixed(2)}</p>
            </div>
          </div>

          <div if.bind="strategy.notes.length" class="mt-4 space-y-2">
            <p repeat.for="note of strategy.notes" class="list-bullet">${note}</p>
          </div>

          <div if.bind="strategy.retailers?.length" class="mt-5 grid gap-2">
            <div repeat.for="retailer of strategy.retailers" class="mini-stat">
              <span class="mini-stat__label">${retailer.retailer}</span>
              <span class="mini-stat__value">$${retailer.total.toFixed(2)} · ${retailer.missingItems} missing</span>
            </div>
          </div>
        </article>
      </div>

      <div if.bind="!basket" class="empty-state">
        Price the basket to see single-store and split-basket strategies.
      </div>
    </section-shell>

    <section-shell
      heading="Line-by-line results"
      subheading="Matched products"
      aside="Each line shows its current recommendation and any warnings about substitutions or missing matches."
    >
      <div if.bind="basket" class="space-y-3">
        <article repeat.for="line of basket.lines" class="soft-panel">
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="eyebrow">Basket line</p>
              <h3 class="mt-2 font-display text-2xl">${line.query}</h3>
            </div>
            <span class="pill-tag">${line.quantity}×</span>
          </div>

          <p if.bind="line.recommended" class="mt-3 text-sm muted-copy">
            ${line.recommended.retailer} · ${line.recommended.productName} · $${line.recommended.shelfPrice.toFixed(2)}
          </p>
          <p if.bind="!line.recommended" class="mt-3 text-sm danger-copy">No confident match yet.</p>

          <div if.bind="line.notes.length" class="mt-4 space-y-2">
            <p repeat.for="note of line.notes" class="list-bullet">${note}</p>
          </div>
        </article>
      </div>
    </section-shell>
  </div>
</div>
</template>
