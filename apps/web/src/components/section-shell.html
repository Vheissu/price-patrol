<section class="panel">
  <div if.bind="heading" class="section-head">
    <h2 class="section-head__title">${heading}</h2>
    <span if.bind="meta" class="section-head__meta">${meta}</span>
  </div>
  <p if.bind="note" class="notice" style="margin-top: -0.5rem; margin-bottom: 0.85rem;">${note}</p>
  <au-slot></au-slot>
</section>
