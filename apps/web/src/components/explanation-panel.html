<div>
  <div if.bind="isLoading" class="space-y-2">
    <div class="skeleton" style="height: 0.8rem; width: 92%;"></div>
    <div class="skeleton" style="height: 0.8rem; width: 78%;"></div>
    <div class="skeleton" style="height: 0.8rem; width: 60%;"></div>
  </div>
  <div if.bind="error" class="error-note">${error}</div>

  <div if.bind="explanation" class="space-y-4">
    <p class="text-sm muted-copy" style="line-height: 1.55;">${explanation.summary}</p>

    <div if.bind="explanation.reasons.length">
      <p class="micro-label mb-1.5">Why it ranked here</p>
      <ul class="list-disc space-y-1 pl-4">
        <li repeat.for="reason of explanation.reasons" class="text-sm muted-copy">${reason}</li>
      </ul>
    </div>

    <div if.bind="explanation.rankingFactors.length">
      <p class="micro-label mb-1.5">Factors</p>
      <ul class="list-disc space-y-1 pl-4">
        <li repeat.for="factor of explanation.rankingFactors" class="text-sm muted-copy">${factor}</li>
      </ul>
    </div>

    <div if.bind="explanation.exclusions.length">
      <p class="micro-label mb-1.5">Excluded</p>
      <ul class="list-disc space-y-1 pl-4">
        <li repeat.for="reason of explanation.exclusions" class="text-sm muted-copy">${reason}</li>
      </ul>
    </div>
  </div>

  <div if.bind="!isLoading && !error && !explanation" class="text-sm faint-copy">
    Run a comparison to see the reasoning.
  </div>
</div>
