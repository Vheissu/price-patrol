<template>
<article if.bind="card" class="result-card" class.result-card--hero.bind="highlight">
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0">
      <p if.bind="heading" class="eyebrow">${heading}</p>
      <h3 class="mt-1 font-display text-xl leading-tight sm:text-2xl">${card.productName}</h3>
      <p class="mt-1 text-sm muted-copy">
        ${card.retailer}
        <span if.bind="card.brand"> &middot; ${card.brand}</span>
        <span if.bind="card.packSize"> &middot; ${card.packSize}</span>
      </p>
    </div>
    <div class="text-right shrink-0">
      <p class="font-display text-3xl leading-none font-bold sm:text-4xl" style="color: var(--accent)">${priceText}</p>
      <p if.bind="card.unitPrice" class="mt-1 text-xs muted-copy">${card.unitPrice}</p>
    </div>
  </div>

  <div class="mt-4 flex flex-wrap gap-2">
    <div class="mini-stat">
      <span class="mini-stat__label">Confidence</span>
      <span class="mini-stat__value">${card.confidenceLabel} &middot; ${confidencePercent}</span>
    </div>
    <div class="mini-stat">
      <span class="mini-stat__label">Freshness</span>
      <span class="mini-stat__value">${card.freshnessLabel}</span>
    </div>
    <div class="mini-stat">
      <span class="mini-stat__label">Availability</span>
      <span class="mini-stat__value">${card.availability}</span>
    </div>
  </div>

  <div if.bind="card.savingsVsNext != null || card.savingsVsHighest != null || card.promotionText || card.inferredUnitPrice" class="mt-3 flex flex-wrap gap-1.5">
    <span if.bind="card.savingsVsNext != null" class="pill-tag pill-tag--savings">Save $${card.savingsVsNext.toFixed(2)} vs next</span>
    <span if.bind="card.savingsVsHighest != null" class="pill-tag">Save $${card.savingsVsHighest.toFixed(2)} vs priciest</span>
    <span if.bind="card.promotionText" class="pill-tag pill-tag--accent">${card.promotionText}</span>
    <span if.bind="card.inferredUnitPrice" class="pill-tag">Unit price inferred</span>
  </div>

  <div if.bind="card.notes.length" class="mt-3 space-y-1">
    <p repeat.for="note of card.notes" class="text-xs leading-relaxed muted-copy">${note}</p>
  </div>
</article>
</template>
