<div class="min-h-screen" style="background: var(--paper); color: var(--ink);">
  <header class="top-bar">
    <div class="top-bar__inner">
      <a class="brand" load="today">
        <span class="brand__mark" aria-hidden="true"></span>
        Price Patrol
        <span class="brand__tagline hidden md:inline">the specials page for your pantry</span>
      </a>
      <nav class="top-bar__nav" aria-label="Primary">
        <a repeat.for="item of navigation" class="nav-link" load.bind="item.route">
          ${item.label}
        </a>
        <button type="button" class="theme-toggle" title.bind="themeLabel" aria-label.bind="themeLabel" click.trigger="toggleTheme()">
          ${themeGlyph}
        </button>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <au-viewport></au-viewport>
  </main>
</div>
